name: PRISM temporary report mirror cleanup

on:
  push:
    branches: [main]
    paths:
      - 'PRISM_REPORT_CLEANUP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary mirror files and workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf _chatgpt_report_mirror _chatgpt_report_artifact_pointer.json PRISM_REPORT_CLEANUP_TRIGGER.txt .github/workflows/prism_report_cleanup.yml
          git commit -m 'chore: remove temporary PRISM report mirror files'
          git push origin HEAD:main
