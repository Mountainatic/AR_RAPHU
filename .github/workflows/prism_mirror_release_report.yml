name: PRISM mirror release report

on:
  push:
    branches: [main]
    paths:
      - 'PRISM_REPORT_MIRROR_TRIGGER.txt'

permissions:
  contents: write

jobs:
  mirror-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect release and mirror report assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: prism-industrial-cpu-v1-20260802
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _chatgpt_report_mirror _chatgpt_report_downloads _chatgpt_report_extract
          mkdir -p _chatgpt_report_mirror _chatgpt_report_downloads _chatgpt_report_extract

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > _chatgpt_report_mirror/RELEASE_METADATA.json
          jq -r '.body // ""' _chatgpt_report_mirror/RELEASE_METADATA.json > _chatgpt_report_mirror/RELEASE_NOTES.md
          jq -r '.assets[] | [.id,.name,.size,.browser_download_url] | @tsv' \
            _chatgpt_report_mirror/RELEASE_METADATA.json > _chatgpt_report_mirror/ASSET_LIST.tsv

          jq -r '.assets[]
            | select(.size < 52428800)
            | select((.name | ascii_downcase) | test("report|summary|decision|leaderboard|final"))
            | [.id,.name,.size] | @tsv' \
            _chatgpt_report_mirror/RELEASE_METADATA.json > /tmp/matches.tsv

          if [[ ! -s /tmp/matches.tsv ]]; then
            jq -r '.assets[]
              | select(.size < 26214400)
              | select((.name | ascii_downcase) | test("\\.(md|txt|json|html|pdf|zip)$"))
              | [.id,.name,.size] | @tsv' \
              _chatgpt_report_mirror/RELEASE_METADATA.json > /tmp/matches.tsv
          fi

          while IFS=$'\t' read -r asset_id asset_name asset_size; do
            [[ -n "${asset_id:-}" ]] || continue
            safe_name=$(printf '%s' "$asset_name" | tr '/\\' '__')
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "_chatgpt_report_downloads/${safe_name}"
          done < /tmp/matches.tsv

          find _chatgpt_report_downloads -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            lower=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              *.zip)
                dest="_chatgpt_report_extract/${base%.zip}"
                mkdir -p "$dest"
                unzip -qq "$f" -d "$dest" || true
                ;;
              *.md|*.txt|*.json|*.html|*.pdf)
                cp "$f" "_chatgpt_report_mirror/$base"
                ;;
            esac
          done

          find _chatgpt_report_extract -type f \( \
              -iname '*report*.md' -o -iname '*report*.txt' -o -iname '*report*.json' -o -iname '*report*.html' -o -iname '*report*.pdf' \
              -o -iname '*summary*.md' -o -iname '*summary*.txt' -o -iname '*decision*.json' -o -iname '*leaderboard*.csv' \
            \) -size -20M -print0 | while IFS= read -r -d '' f; do
              rel=${f#_chatgpt_report_extract/}
              safe=$(printf '%s' "$rel" | tr '/\\' '__')
              cp "$f" "_chatgpt_report_mirror/$safe"
            done

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_chatgpt_report_mirror')
          rows = []
          for p in sorted(root.iterdir()):
              if p.is_file():
                  b = p.read_bytes()
                  rows.append({'name': p.name, 'size': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
          (root/'MIRROR_MANIFEST.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit mirror and remove temporary trigger/workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f PRISM_REPORT_MIRROR_TRIGGER.txt .github/workflows/prism_mirror_release_report.yml
          git add _chatgpt_report_mirror
          git commit -m 'chore: temporarily mirror PRISM CPU release report'
          git push origin HEAD:main
