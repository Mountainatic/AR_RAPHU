name: PRISM v2.2 PMSM SW corrected-C contract audit

on:
  workflow_dispatch:
  push:
    branches:
      - prism-v2-2-independent-confirmation-pmsm-20260901
    paths:
      - '.github/workflows/prism_v22_pmsm_sw_c_contract.yml'
      - 'PRISM_INDUSTRIAL_BENCHMARK_V1/src/prism_benchmark/pmsm_sw_c_contract.py'
      - 'PRISM_INDUSTRIAL_BENCHMARK_V1/tests/test_pmsm_sw_c_contract.py'
      - 'PRISM_INDUSTRIAL_BENCHMARK_V1/configs/prism_v22_pmsm_sw_implementation_semantics_freeze_20260901.json'
      - 'PRISM_INDUSTRIAL_BENCHMARK_V1/src/prism_benchmark/v211_support.py'
      - 'PRISM_INDUSTRIAL_BENCHMARK_V1/src/prism_benchmark/v211_selection.py'

permissions:
  contents: read

jobs:
  c-contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout confirmation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow pyreadr scipy pytest

      - name: Compile corrected-C contract helper
        run: |
          python -m py_compile PRISM_INDUSTRIAL_BENCHMARK_V1/src/prism_benchmark/pmsm_sw_c_contract.py

      - name: Run corrected-C contract tests
        run: |
          pytest -q \
            PRISM_INDUSTRIAL_BENCHMARK_V1/tests/test_v211_native_support.py \
            PRISM_INDUSTRIAL_BENCHMARK_V1/tests/test_pmsm_sw_c_contract.py
