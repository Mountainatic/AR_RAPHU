name: PRISM report artifact handoff

on:
  push:
    branches: [main]
    paths:
      - 'PRISM_REPORT_ARTIFACT_TRIGGER.txt'

permissions:
  contents: write
  actions: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload report artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: prism-cpu-final-report
          path: _chatgpt_report_mirror/CPU_FINAL_REPORT.md
          if-no-files-found: error
          retention-days: 1

      - name: Record artifact pointer and remove temporary workflow
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          obj = {
              'repo': os.environ['GITHUB_REPOSITORY'],
              'run_id': int(os.environ['RUN_ID']),
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_name': 'prism-cpu-final-report',
              'report_path': '_chatgpt_report_mirror/CPU_FINAL_REPORT.md'
          }
          open('_chatgpt_report_artifact_pointer.json','w',encoding='utf-8').write(json.dumps(obj, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f PRISM_REPORT_ARTIFACT_TRIGGER.txt .github/workflows/prism_report_artifact.yml
          git add _chatgpt_report_artifact_pointer.json
          git commit -m 'chore: record temporary PRISM report artifact pointer'
          git push origin HEAD:main
