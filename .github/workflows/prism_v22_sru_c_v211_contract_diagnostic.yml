name: PRISM v2.2 SRU v2.1.1-compatible C diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - prism-v2-2-beta-debutanizer-benchmark-20260824
    paths:
      - '.github/workflows/prism_v22_sru_c_v211_contract_diagnostic.yml'
      - 'PRISM_INDUSTRIAL_BENCHMARK_V1/scripts/run_prism_v22_sru_c_v211_contract_diagnostic.py'

permissions:
  contents: write

jobs:
  c-v211-contract-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '1024'
      OUTDIR: sru_c_v211_contract_diag

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and verify imports
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib torchinfo pyarrow pyreadr pytest
          python - <<'PY'
          import numpy, pandas, scipy, sklearn, pyarrow, pyreadr
          print('diagnostic dependencies import OK')
          PY

      - name: Fetch official SRU data
        run: |
          mkdir -p "$OUTDIR"
          curl -fsSL \
            https://raw.githubusercontent.com/CHM00/RTA-TCN-and-JITL-RTA-TCN/main/SRU/SRU_data.txt \
            -o SRU_data.txt
          sha256sum SRU_data.txt | tee "$OUTDIR/upstream_sha256.txt"

      - name: Compile diagnostic wrapper
        run: |
          python -m py_compile PRISM_INDUSTRIAL_BENCHMARK_V1/scripts/run_prism_v22_sru_c_v211_contract_diagnostic.py

      - name: Run v2.1.1-compatible C counterfactual
        run: |
          set -o pipefail
          python PRISM_INDUSTRIAL_BENCHMARK_V1/scripts/run_prism_v22_sru_c_v211_contract_diagnostic.py \
            --data SRU_data.txt \
            --config PRISM_INDUSTRIAL_BENCHMARK_V1/configs/prism_v22_sru_rta_tcn_full.json \
            --output "$OUTDIR/RESULT.json" \
            2>&1 | tee "$OUTDIR/run.log"

      - name: Build compact diagnostic report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('sru_c_v211_contract_diag')
          p = out / 'RESULT.json'
          if not p.exists():
              (out / 'RESULT.md').write_text('# SRU v2.1.1-compatible C diagnostic\n\nRESULT.json was not produced. Inspect run.log.\n')
              raise SystemExit(0)
          r = json.loads(p.read_text())
          lines = [
              '# SRU v2.2 with v2.1.1-compatible C contract',
              '',
              'Diagnostic only. C ridge is numerical-stability-only, smallest stable ridge is selected, OOF input-path preservation is required, and BEST_ACTIVE_K is the terminal C fallback. Strict K, Gamma_CT, W and A are unchanged.',
              '',
              '## Branches',
              '',
          ]
          for b in ('D','M','S'):
              a = r['branch_structures'][b]
              c = a.get('C', {})
              path = c.get('input_path_preservation', {})
              lines += [
                  f"- {b}: eligible={a['eligible']}; reason={a.get('reason','PASS')}; active={a.get('active_channels',[])}; C_family={c.get('family')}; C_alpha={c.get('selected_alpha')}; fallback={c.get('fallback_used')}; path_pass={path.get('pass')}; variance_ratio={path.get('input_prediction_variance_ratio_to_target')}; bestK_variance_ratio={path.get('best_active_k_variance_ratio_to_target')}; candidate_mse={path.get('candidate_mse')}; bestK_mse={path.get('best_active_k_mse')}",
              ]
          lines += ['', '## Assembly', '']
          lines += [f"- Gamma weights: `{r['gamma_ct']['weights']}`"]
          lines += [f"- W selected: `{r['W']['selected']}`; active={r['W']['active']}"]
          lines += [f"- A selected: `{r['A']['selected']}`; active={r['A']['active']}"]
          lines += ['', '## Test routes', '']
          for route, m in r['nested_routes'].items():
              lines += [f"- {route}: RMSE={m['rmse']:.9f}; MAE={m['mae']:.9f}; R2={m['r2']:.9f}"]
          lines += ['', f"- test_target_used_for_selection={r['test_target_used_for_selection']}"]
          (out / 'RESULT.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-v22-sru-c-v211-contract-diagnostic
          path: sru_c_v211_contract_diag/
          if-no-files-found: warn

      - name: Commit compact diagnostic result
        if: always()
        run: |
          if [ ! -f "$OUTDIR/RESULT.md" ]; then
            exit 0
          fi
          DEST="PRISM_INDUSTRIAL_BENCHMARK_V1/experiments/prism_v2_2_sru_rta_tcn_20260830/diagnostics/c_v211_contract"
          mkdir -p "$DEST"
          cp "$OUTDIR/RESULT.md" "$DEST/"
          if [ -f "$OUTDIR/RESULT.json" ]; then cp "$OUTDIR/RESULT.json" "$DEST/"; fi
          cp "$OUTDIR/upstream_sha256.txt" "$DEST/" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'No diagnostic result changes'
          else
            git commit -m 'diagnostic: add SRU v2.1.1-compatible C result'
            git push origin HEAD:prism-v2-2-beta-debutanizer-benchmark-20260824
          fi
