name: PRISM v2.2 SRU KGamma-A no-W diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - prism-v2-2-beta-debutanizer-benchmark-20260824
    paths:
      - '.github/workflows/prism_v22_sru_kga_no_w_diagnostic.yml'
      - 'PRISM_INDUSTRIAL_BENCHMARK_V1/scripts/run_prism_v22_sru_c_best_alpha_w_identity_diagnostic.py'

permissions:
  contents: write

jobs:
  kga-no-w-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '1024'
      OUTDIR: sru_kga_no_w_diag

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyarrow pyreadr

      - name: Fetch official SRU data
        run: |
          mkdir -p "$OUTDIR"
          curl -fsSL \
            https://raw.githubusercontent.com/CHM00/RTA-TCN-and-JITL-RTA-TCN/main/SRU/SRU_data.txt \
            -o SRU_data.txt
          sha256sum SRU_data.txt | tee "$OUTDIR/upstream_sha256.txt"

      - name: Run KGamma plus A with W forced identity
        run: |
          set -o pipefail
          python PRISM_INDUSTRIAL_BENCHMARK_V1/scripts/run_prism_v22_sru_c_best_alpha_w_identity_diagnostic.py \
            --data SRU_data.txt \
            --config PRISM_INDUSTRIAL_BENCHMARK_V1/configs/prism_v22_sru_rta_tcn_full.json \
            --output "$OUTDIR/RESULT.json" \
            2>&1 | tee "$OUTDIR/run.log"

      - name: Build compact report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('sru_kga_no_w_diag')
          p = out / 'RESULT.json'
          if not p.exists():
              (out / 'RESULT.md').write_text('# SRU KGamma-A no-W diagnostic\n\nRESULT.json was not produced. Inspect run.log.\n')
              raise SystemExit(0)
          r = json.loads(p.read_text())
          lines = [
              '# SRU v2.2 KGamma-A no-W diagnostic', '',
              'Best-mean C alpha is retained; W is forced to IDENTITY to isolate whether K/Gamma itself helps or harms the mature residual A route.', '',
              f"- Gamma weights: `{r['gamma_ct']['weights']}`",
              f"- W selected: `{r['W']['selected']}`; active={r['W']['active']}",
              f"- A selected: `{r['A']['selected']}`; active={r['A']['active']}", '',
          ]
          for route, m in r['nested_routes'].items():
              lines.append(f"- {route}: RMSE={m['rmse']:.9f}; MAE={m['mae']:.9f}; R2={m['r2']:.9f}")
          lines += ['', f"- test_target_used_for_selection={r['test_target_used_for_selection']}"]
          (out / 'RESULT.md').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-v22-sru-kga-no-w-diagnostic
          path: sru_kga_no_w_diag/
          if-no-files-found: warn

      - name: Commit compact diagnostic result
        if: always()
        run: |
          if [ ! -f "$OUTDIR/RESULT.md" ]; then exit 0; fi
          DEST="PRISM_INDUSTRIAL_BENCHMARK_V1/experiments/prism_v2_2_sru_rta_tcn_20260830/diagnostics/kga_no_w"
          mkdir -p "$DEST"
          cp "$OUTDIR/RESULT.md" "$DEST/"
          if [ -f "$OUTDIR/RESULT.json" ]; then cp "$OUTDIR/RESULT.json" "$DEST/"; fi
          cp "$OUTDIR/upstream_sha256.txt" "$DEST/" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'No diagnostic result changes'
          else
            git commit -m 'diagnostic: add SRU KGamma-A no-W result'
            git push origin HEAD:prism-v2-2-beta-debutanizer-benchmark-20260824
          fi
