name: PRISM v2.2 full KWA vs RTA-TCN SRU

on:
  workflow_dispatch:
  push:
    branches:
      - prism-v2-2-beta-debutanizer-benchmark-20260824
    paths:
      - '.github/workflows/prism_v22_sru_rta_tcn.yml'

permissions:
  contents: write

jobs:
  sru-full-kwa-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '1024'
      OUTDIR: sru_out

    steps:
      - name: Checkout PRISM branch
        uses: actions/checkout@v4
        with:
          path: prism_repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib torchinfo pyarrow pyreadr pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch official author code and SRU data
        run: |
          mkdir -p "$OUTDIR"
          curl -fsSL \
            https://raw.githubusercontent.com/CHM00/RTA-TCN-and-JITL-RTA-TCN/main/SRU/RTA-TCN-SRU.py \
            -o RTA-TCN-SRU.author.py
          curl -fsSL \
            https://raw.githubusercontent.com/CHM00/RTA-TCN-and-JITL-RTA-TCN/main/SRU/SRU_data.txt \
            -o SRU_data.txt
          sha256sum RTA-TCN-SRU.author.py SRU_data.txt | tee "$OUTDIR/upstream_sha256.txt"
          python - <<'PY'
          import pandas as pd
          exact = pd.read_csv("SRU_data.txt", sep=r"\s+").values
          corrected = pd.read_csv("SRU_data.txt", sep=r"\s+", header=None).values
          print("exact_author_shape =", exact.shape)
          print("corrected_shape    =", corrected.shape)
          assert exact.shape == (10080, 7), exact.shape
          assert corrected.shape == (10081, 7), corrected.shape
          PY

      - name: Compile full PRISM v2.2 SRU runner
        run: |
          python -m py_compile prism_repo/PRISM_INDUSTRIAL_BENCHMARK_V1/scripts/run_prism_v22_sru_full.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("prism_repo/PRISM_INDUSTRIAL_BENCHMARK_V1/configs/prism_v22_sru_rta_tcn_full.json")
          cfg = json.loads(p.read_text())
          assert cfg["protocol_id"] == "PRISM_V2_2_BETA_SRU_RTA_TCN_FULL_KWA_MATCHED_V1"
          assert cfg["reported_nested_routes"] == ["K_GAMMA", "K_GAMMA_W", "K_GAMMA_W_A"]
          print(cfg["protocol_id"])
          PY

      - name: Run full PRISM v2.2 K plus W plus A
        id: prism_full
        run: |
          set -o pipefail
          python prism_repo/PRISM_INDUSTRIAL_BENCHMARK_V1/scripts/run_prism_v22_sru_full.py \
            --data SRU_data.txt \
            --config prism_repo/PRISM_INDUSTRIAL_BENCHMARK_V1/configs/prism_v22_sru_rta_tcn_full.json \
            --output "$OUTDIR/prism_v22_full_kwa.json" \
            2>&1 | tee "$OUTDIR/prism_v22_full_kwa.log"

      - name: Run exact-author RTA-TCN
        id: rta_exact
        continue-on-error: true
        run: |
          cp RTA-TCN-SRU.author.py RTA-TCN-SRU.exact.py
          set -o pipefail
          python RTA-TCN-SRU.exact.py 2>&1 | tee "$OUTDIR/rta_exact.log"

      - name: Build corrected-parser RTA-TCN
        run: |
          cp RTA-TCN-SRU.author.py RTA-TCN-SRU.corrected.py
          python - <<'PY'
          from pathlib import Path
          p = Path("RTA-TCN-SRU.corrected.py")
          s = p.read_text(encoding="utf-8")
          old = r"pd.read_csv('SRU_data.txt', sep='\s+')"
          new = r"pd.read_csv('SRU_data.txt', sep='\s+', header=None)"
          if old not in s:
              raise SystemExit("author pd.read_csv line not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          grep -n "read_csv" RTA-TCN-SRU.corrected.py

      - name: Run corrected-parser RTA-TCN
        id: rta_corrected
        continue-on-error: true
        run: |
          set -o pipefail
          python RTA-TCN-SRU.corrected.py 2>&1 | tee "$OUTDIR/rta_corrected.log"

      - name: Build publication evidence record
        if: always()
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          outdir = Path("sru_out")
          def parse_rta(path):
              text = Path(path).read_text(errors="replace") if Path(path).exists() else ""
              rmses = [float(x) for x in re.findall(r"RMSE:\s*([0-9.eE+-]+)", text)]
              r2s = [float(x) for x in re.findall(r"相关系数：\s*([0-9.eE+-]+)", text)]
              mses = [float(x) for x in re.findall(r"MSE：\s*([0-9.eE+-]+)", text)]
              return {
                  "train_mse": mses[-2] if len(mses) >= 2 else None,
                  "test_mse": mses[-1] if mses else None,
                  "train_rmse": rmses[-2] if len(rmses) >= 2 else None,
                  "test_rmse": rmses[-1] if rmses else None,
                  "train_r2": r2s[-2] if len(r2s) >= 2 else None,
                  "test_r2": r2s[-1] if r2s else None,
              }

          full_path = outdir / "prism_v22_full_kwa.json"
          full = json.loads(full_path.read_text()) if full_path.exists() else None
          combined = {
              "rta_tcn_input_only": {
                  "exact_author": parse_rta(outdir / "rta_exact.log"),
                  "corrected_parser": parse_rta(outdir / "rta_corrected.log"),
              },
              "prism_v2_2_beta_full_dynamic": full,
          }
          (outdir / "SRU_FULL_KWA_MATCHED_RESULT.json").write_text(json.dumps(combined, indent=2, allow_nan=True) + "\n")

          def fmt(value):
              return "NOT_AVAILABLE" if value is None else f"{value:.9f}"

          lines = [
              "# PRISM v2.2(beta) full KWA vs RTA-TCN — SRU",
              "",
              "## Scope",
              "",
              "- RTA-TCN is rerun from the official author code on the official SRU file.",
              "- The exact-author parser and corrected `header=None` parser are reported separately.",
              "- The new PRISM result is the full beta chain: `D/M/S -> K/C -> Gamma_CT -> DeltaW -> A`.",
              "- The previous D/M/S + Ridge experiment is a temporal-representation ablation and is not labeled as full PRISM here.",
              "- SRU cadence is 60 s; CT tau is frozen in physical time as [60,120,240,480,960,1440] s.",
              "",
              "## Information-set warning",
              "",
              "- Official RTA-TCN reference: input-only; historical target y is forbidden.",
              "- Full PRISM KWA: dynamic record-time information; only y[t-1] or older and mature residuals are legal.",
              "- Therefore RTA-TCN vs full KWA is not claimed to be strictly information-matched. It is a model/task reference plus a full-architecture result.",
              "",
              "## RTA-TCN official-code rerun",
              "",
          ]
          for parser in ("exact_author", "corrected_parser"):
              result = combined["rta_tcn_input_only"][parser]
              lines += [
                  f"### {parser}",
                  f"- Test RMSE: **{fmt(result['test_rmse'])}**",
                  f"- Test R2 / author-labeled score: **{fmt(result['test_r2'])}**",
                  "",
              ]

          if full is None:
              lines += ["## Full PRISM v2.2(beta)", "", "FULL_RESULT_NOT_AVAILABLE — inspect `prism_v22_full_kwa.log`.", ""]
          else:
              lines += ["## Full PRISM v2.2(beta)", ""]
              for route in ("K_GAMMA", "K_GAMMA_W", "K_GAMMA_W_A", "PERSISTENCE"):
                  metric = full["nested_routes"][route]
                  lines += [f"- **{route}**: RMSE {metric['rmse']:.9f}, MAE {metric['mae']:.9f}, R2 {metric['r2']:.9f}"]
              lines += [
                  "",
                  f"- Gamma weights: `{full['gamma_ct']['weights']}`",
                  f"- W selected: `{full['W']['selected']}`; active={full['W']['active']}",
                  f"- A selected: `{full['A']['selected']}`; active={full['A']['active']}",
                  f"- Test target used for selection: `{full['test_target_used_for_selection']}`",
                  f"- Runtime: {full['elapsed_seconds']:.3f} s",
                  "",
                  "### Branch admission",
                  "",
              ]
              for branch in ("D", "M", "S"):
                  audit = full["branch_structures"][branch]
                  lines += [f"- {branch}: eligible={audit['eligible']}; active K channels={audit.get('active_channels', [])}; reason={audit.get('reason', 'PASS')}"]
          lines += [
              "",
              "## Upstream SHA256",
              "",
              "```text",
              (outdir / "upstream_sha256.txt").read_text().strip() if (outdir / "upstream_sha256.txt").exists() else "NOT_AVAILABLE",
              "```",
              "",
              "## Scientific note",
              "",
              "K/W/A selection is frozen from author-train development/calibration data. The final RTA author test targets are not used for PRISM route, candidate, penalty, Gamma, W, or A selection.",
          ]
          (outdir / "SRU_FULL_KWA_MATCHED_RESULT.md").write_text("\n".join(lines) + "\n")
          PY

      - name: Upload full evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-v22-sru-full-kwa-rta-tcn
          path: |
            sru_out/
            prism_repo/PRISM_INDUSTRIAL_BENCHMARK_V1/configs/prism_v22_sru_rta_tcn_full.json
          if-no-files-found: warn

      - name: Commit full result to benchmark branch
        if: always()
        run: |
          if [ ! -f "$OUTDIR/SRU_FULL_KWA_MATCHED_RESULT.json" ]; then
            echo "No evidence record to commit"
            exit 0
          fi
          DEST="prism_repo/PRISM_INDUSTRIAL_BENCHMARK_V1/experiments/prism_v2_2_sru_rta_tcn_20260830/full_kwa"
          mkdir -p "$DEST"
          cp "$OUTDIR/SRU_FULL_KWA_MATCHED_RESULT.json" "$DEST/"
          cp "$OUTDIR/SRU_FULL_KWA_MATCHED_RESULT.md" "$DEST/"
          cp "$OUTDIR/upstream_sha256.txt" "$DEST/"
          if [ -f "$OUTDIR/prism_v22_full_kwa.json" ]; then cp "$OUTDIR/prism_v22_full_kwa.json" "$DEST/"; fi
          cd prism_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRISM_INDUSTRIAL_BENCHMARK_V1/experiments/prism_v2_2_sru_rta_tcn_20260830/full_kwa
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "results: add full v2.2 KWA SRU benchmark"
            git push origin HEAD:prism-v2-2-beta-debutanizer-benchmark-20260824
          fi
