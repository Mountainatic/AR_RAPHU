name: RTA-TCN corrected parser reproduction

on:
  push:
    branches:
      - prism-v2-2-beta-debutanizer-benchmark-20260824
    paths:
      - '.github/workflows/prism_v22_rta_tcn_corrected_parser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rta-tcn-corrected-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '1024'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn matplotlib torchinfo
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch author code and data, patch parser only
        run: |
          curl -fsSL https://raw.githubusercontent.com/CHM00/RTA-TCN-and-JITL-RTA-TCN/main/DC/RTA-TCN-DC.py -o RTA-TCN-DC.py
          curl -fsSL https://raw.githubusercontent.com/CHM00/RTA-TCN-and-JITL-RTA-TCN/main/DC/Debutanizer_data.txt -o Debutanizer_Data.txt
          sha256sum RTA-TCN-DC.py Debutanizer_Data.txt > source_sha256.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('RTA-TCN-DC.py')
          s = p.read_text(encoding='utf-8')
          old = "data = pd.read_csv('Debutanizer_Data.txt', sep='\\\\s+')"
          if old not in s:
              old = "data = pd.read_csv('Debutanizer_Data.txt', sep='\\s+')"
          assert old in s, 'author parser line not found'
          s = s.replace(old, "data = pd.read_csv('Debutanizer_Data.txt', sep='\\\\s+', header=None)", 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep 'pd.read_csv' RTA-TCN-DC.py

      - name: Run author model with parser correction only
        id: author_run
        continue-on-error: true
        run: |
          set -o pipefail
          python RTA-TCN-DC.py 2>&1 | tee rta_tcn_corrected_parser.log

      - name: Build persistent result record
        if: always()
        run: |
          TEST_RMSE="$(grep 'RMSE:' rta_tcn_corrected_parser.log 2>/dev/null | tail -n 1 | sed 's/.*RMSE:[[:space:]]*//' || true)"
          TEST_R2="$(grep '相关系数' rta_tcn_corrected_parser.log 2>/dev/null | tail -n 1 | sed 's/.*：[[:space:]]*//' || true)"
          TRAIN_RMSE="$(grep 'RMSE:' rta_tcn_corrected_parser.log 2>/dev/null | head -n 1 | sed 's/.*RMSE:[[:space:]]*//' || true)"
          TRAIN_R2="$(grep '相关系数' rta_tcn_corrected_parser.log 2>/dev/null | head -n 1 | sed 's/.*：[[:space:]]*//' || true)"
          {
            echo '# RTA-TCN corrected-parser reproduction'
            echo
            echo '- Source model/training code: author `DC/RTA-TCN-DC.py`.'
            echo '- Data: author `DC/Debutanizer_data.txt`.'
            echo '- Only scientific correction: `pd.read_csv(..., header=None)` so the first numeric record is not consumed as a header.'
            echo '- All model/training semantics remain author-original: seed 1024, sequence length 40, train boundary 1687, 240 epochs, batch size 64, learning rate 0.001, 7 process inputs and no target history.'
            echo "- Workflow run outcome: ${{ steps.author_run.outcome }}"
            echo
            echo '## Metrics'
            echo "- Train RMSE: ${TRAIN_RMSE:-NOT_AVAILABLE}"
            echo "- Train R2: ${TRAIN_R2:-NOT_AVAILABLE}"
            echo "- Test RMSE: ${TEST_RMSE:-NOT_AVAILABLE}"
            echo "- Test R2: ${TEST_R2:-NOT_AVAILABLE}"
            echo
            echo '## Upstream source hashes before parser patch'
            echo '```text'
            cat source_sha256.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Log tail'
            echo '```text'
            tail -n 40 rta_tcn_corrected_parser.log 2>/dev/null || true
            echo '```'
          } > /tmp/RTA_TCN_CORRECTED_PARSER_RESULT.md

      - name: Checkout only after external model execution
        if: always()
        uses: actions/checkout@v4
        with:
          ref: prism-v2-2-beta-debutanizer-benchmark-20260824

      - name: Commit result
        if: always()
        run: |
          mkdir -p PRISM_INDUSTRIAL_BENCHMARK_V1/experiments/prism_v2_2_debutanizer_rta_tcn_20260824
          cp /tmp/RTA_TCN_CORRECTED_PARSER_RESULT.md PRISM_INDUSTRIAL_BENCHMARK_V1/experiments/prism_v2_2_debutanizer_rta_tcn_20260824/RTA_TCN_CORRECTED_PARSER_RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PRISM_INDUSTRIAL_BENCHMARK_V1/experiments/prism_v2_2_debutanizer_rta_tcn_20260824/RTA_TCN_CORRECTED_PARSER_RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m 'benchmark: record corrected-parser RTA-TCN reproduction'
            git push origin HEAD:prism-v2-2-beta-debutanizer-benchmark-20260824
          fi
