[project]
name = "ar-raphu-validation"
version = "0.2.0"
description = "Frozen AR-RAPHU v2 validation implementation"
requires-python = "==3.10.*"
dependencies = [
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyarrow==24.0.0",
  "pypdf>=6.14.2",
  "scipy==1.15.3",
  "scikit-learn==1.7.1",
  "statsmodels==0.14.5",
  "xgboost==3.0.2",
  "nfoursid==1.0.2",
  "torch==2.8.0",
  "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pypi-tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu128"
explicit = true
