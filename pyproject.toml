[project]
name = "ar-raphu-validation"
version = "0.2.0"
description = "Frozen AR-RAPHU v2 validation implementation"
requires-python = "==3.10.*"
dependencies = [
  "nonlinear-benchmarks==1.0.1",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyarrow==24.0.0",
  "scipy==1.15.3",
  "torch==2.8.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
norecursedirs = ["return_*", "evidence_readonly", "data"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pypi-tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
