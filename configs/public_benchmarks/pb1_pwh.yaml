{
  "schema_version": 7,
  "suite": "OPS_UOI_PUBLIC_BENCHMARK_PB1",
  "dataset": {
    "id": "pwh",
    "version": "4tu_12950081_v1",
    "official_split": true,
    "input_columns": ["input"],
    "target_columns": ["output"],
    "sequence_policy": "official_record",
    "development_split": {
      "status": "FROZEN",
      "unit": "whole_estimation_record",
      "train_phase_zero_based": [0, 15],
      "validation_phase_zero_based": [16, 19],
      "amplitude_zero_based": [0, 4],
      "periods_per_record": 2,
      "periods_are_atomic": true,
      "validation_fraction": 0.2
    },
    "confirmation": {
      "primary": "uVal/yVal all five amplitude levels",
      "secondary_ood": "uValArr/yValArr increasing-amplitude record",
      "access": "once_after_model_freeze"
    }
  },
  "task": {
    "tracks": ["X", "AR", "XAR"],
    "horizons": [1, 5, 10, 20],
    "use_future_x": false,
    "lx_grid": [16, 32, 64, 128],
    "ly_grid": [1, 4, 8, 16, 32, 64],
    "xar_history_selection": {
      "H1_baseline_faithful": {
        "selector": "ARX_VALIDATION_AIC",
        "nx_candidates": [1, 20],
        "ny_candidates": [1, 20],
        "shared_by": ["arx_qr", "pnarx", "mlpnarx_champneys2024"]
      },
      "H2_native_model": {
        "selector": "FULL_LX_LY_GRID_ONE_SE",
        "complexity_key": [
          "Lx_plus_Ly",
          "Lx_times_Ly",
          "max_Lx_Ly",
          "Lx",
          "Ly"
        ]
      },
      "H3_shared_history_fairness": {
        "history": "H1_ARX_AIC_SELECTED",
        "models": [
          "rank1_ar_raphu",
          "fixed_rank2_ar_raphu",
          "full_spectral_ar_raphu",
          "adaptive_spectral_ar_raphu"
        ]
      }
    }
  },
  "basis": {
    "lag_candidates": [
      {"type": "discrete_identity"},
      {"type": "cubic_bspline", "count": 32},
      {"type": "cubic_bspline", "count": 48}
    ],
    "amplitude_count_grid": [16, 20, 24, 28, 32, 40]
  },
  "models": [
    "persistence",
    "arx_qr",
    "pnarx",
    "mlpnarx_champneys2024",
    "rank1_ar_raphu",
    "fixed_rank2_ar_raphu",
    "full_spectral_ar_raphu",
    "adaptive_spectral_ar_raphu"
  ],
  "literature_profiles": {
    "path": "configs/public_benchmarks/PB1_LITERATURE_PROFILES.json",
    "paper_profile": "CHAMPNEYS2024_PEER_REVIEWED",
    "companion_code_commit": "d9c4972f6bd59cfdde23a014bc57579e2af957aa",
    "use_companion_internal_split": false
  },
  "baselines": {
    "arx_primary": {
      "solver": "PIVOTED_QR_OR_SVD_MINIMUM_NORM",
      "scientific_ridge": 0.0,
      "report_effective_rank": true,
      "report_condition_number": true
    },
    "mlpnarx_primary": {
      "profile": "MLPNARX_CHAMPNEYS2024",
      "hidden_layers": 1,
      "activation": "tanh",
      "widths": [2, 5, 7, 10],
      "optimizer": "Adam",
      "learning_rate": 0.01,
      "iterations": 20000,
      "early_stopping": false,
      "initializations": 5,
      "history": "ARX_AIC_SELECTED",
      "scaling": "TRAIN_ONLY_MINMAX_MINUS1_PLUS1",
      "selection": "VALIDATION_AIC"
    }
  },
  "selection": {
    "split": "validation",
    "lepski_enabled": true,
    "rank_budgets": [0.10, 0.05, 0.02],
    "primary_rank_budget": 0.05,
    "test_access": "once_after_freeze",
    "spectral_penalty": {
      "normalization": "POSITIVE_GENERALIZED_EIGENVALUE_MEDIAN_RELATIVE_TO_TRAIN_GRAM",
      "interval": "AUTOMATIC_SHRINKAGE_COVERAGE",
      "near_unpenalized_shrinkage": 0.999,
      "near_zero_shrinkage": 0.001,
      "grid_points_per_axis": 7,
      "boundary_expansions_max": 2,
      "risk": "PHASE_GROUPED_VALIDATION",
      "one_se_tie": "LOWEST_EFFECTIVE_DF"
    }
  },
  "bootstrap": {
    "primary_unit": "PHASE_CLUSTER_ALL_AMPLITUDES_AND_BOTH_PERIODS",
    "within_record_block": "ONLY_IF_PREDECLARED_NESTED_AUDIT_IS_TRIGGERED",
    "development_replicates": 250,
    "confirmation_replicates": 1000,
    "shared_fixed_block_length": null,
    "every_horizon": true,
    "tune_inside_primary_bootstrap": false
  },
  "free_run": {
    "required": true,
    "separate_from_direct": true,
    "development_validation_only": true,
    "initialization": "max_Ly_and_official_initialization"
  },
  "repair_v2": {
    "exact_zero_penalty": true,
    "solver_rescue_ladder": [
      "symmetric_fp64_primary",
      "diagonal_equilibration",
      "iterative_refinement",
      "svd_minimum_norm"
    ],
    "h2_selection_order": [
      "history",
      "resolution",
      "final_penalty"
    ],
    "relative_loss_inflation": true
  },
  "solver": {
    "dtype": "float64",
    "device": "cpu",
    "kkt_relative_residual": 1.0e-8,
    "numerical_jitter": "64*machine_epsilon*max(1,norm2(H_plus_P))",
    "numerical_jitter_is_scientific_ridge": false,
    "maximum_refinement_steps": 5
  }
}
